name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the local 64-bit inference venv; 3.11 is the container
        # base image. Both are supported, so both are tested.
        python-version: ["3.10", "3.11"]

    env:
      # Keep CI hermetic: never pull model weights during unit tests.
      # Model inference is mocked, so the null provider is the correct backend here.
      VISIONIQ_DETECTION_PROVIDER: "null"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt plus pytest/ruff.
        # requirements-ml.txt (torch/ultralytics) is deliberately NOT
        # installed: unit tests mock inference and never download weights.
        # x64 is required -- cryptography (via PyJWT) has no 32-bit wheels.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check . --config ruff.toml --output-format=github

      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --junitxml=junit.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/junit.xml
          if-no-files-found: warn
          retention-days: 14
