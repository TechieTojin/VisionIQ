# =============================================================================
# VisionIQ -- MANUAL deployment workflow
# =============================================================================
#
# This workflow is *manual only* (`workflow_dispatch`). It deliberately has no
# `push` or `pull_request` trigger: infrastructure is never applied automatically
# from a commit.
#
# Authentication uses GitHub OIDC -- there are no long-lived AWS access keys.
# The workflow assumes an AWS IAM role whose ARN comes from a repository or
# environment variable/secret. No account ID or ARN is ever hardcoded here.
#
# -----------------------------------------------------------------------------
# REQUIRED REPO CONFIGURATION (Settings -> ...)
# -----------------------------------------------------------------------------
#  1. AWS side: create an IAM OIDC identity provider for
#     token.actions.githubusercontent.com and an IAM role whose trust policy is
#     scoped to this repository (and ideally to `environment:prod` for the prod
#     role).
#
#  2. Settings -> Environments: create environments named `dev` and `prod`.
#     For `prod` (and optionally `dev`) enable "Required reviewers" -- this is
#     what makes the `terraform apply` job pause for manual human approval.
#     PRODUCTION MUST BE A PROTECTED ENVIRONMENT WITH REQUIRED REVIEWERS;
#     without that protection rule the apply job runs unattended.
#
#  3. Per-environment variables (Settings -> Environments -> <env> -> Variables):
#       AWS_REGION            e.g. ap-south-1
#       ECR_REPOSITORY        e.g. visioniq-worker
#       WORKER_CONTEXT        docker build context (default: backend)
#       WORKER_DOCKERFILE     path to the worker Dockerfile
#                             (default: backend/Dockerfile)
#     Per-environment secret (or variable, if you prefer it non-secret):
#       AWS_DEPLOY_ROLE_ARN   ARN of the role to assume via OIDC
#
#  4. The `terraform apply` job targets `environment: ${{ inputs.environment }}`,
#     so GitHub applies that environment's protection rules to it.
# =============================================================================

name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      apply:
        description: "Run terraform apply after the plan (requires environment approval)"
        type: boolean
        required: false
        default: false

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"

jobs:
  # ---------------------------------------------------------------------------
  # (a) Build and push the worker container to ECR, tagged with the git SHA.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push worker image (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-uri: ${{ steps.build.outputs.image-uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: visioniq-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          BUILD_CONTEXT: ${{ vars.WORKER_CONTEXT || 'backend' }}
          DOCKERFILE: ${{ vars.WORKER_DOCKERFILE || 'backend/Dockerfile' }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          docker build \
            --file "${DOCKERFILE}" \
            --tag "${IMAGE_URI}" \
            --tag "${REGISTRY}/${REPOSITORY}:${{ inputs.environment }}" \
            "${BUILD_CONTEXT}"
          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${REPOSITORY}:${{ inputs.environment }}"
          echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Worker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- environment: \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.meta.outputs.image-tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # (b) Terraform plan. Read-only: produces a saved plan artifact.
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: visioniq-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: >-
          terraform plan -input=false -no-color -lock-timeout=5m
          -var-file=environments/${{ inputs.environment }}.tfvars
          -var="worker_image_tag=${{ needs.build-and-push.outputs.image-tag }}"
          -out=tfplan.binary

      - name: Render plan to text
        run: terraform show -no-color tfplan.binary > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            infrastructure/terraform/tfplan.binary
            infrastructure/terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # (c) Terraform apply -- gated by the GitHub environment.
  #     If the environment has required reviewers configured, this job waits
  #     for a human approval before it starts. That is the production gate.
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Terraform apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-plan]
    if: ${{ inputs.apply }}
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: visioniq-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: infrastructure/terraform

      - name: Terraform apply (saved plan)
        run: terraform apply -input=false -no-color -lock-timeout=5m -auto-approve tfplan.binary

      - name: Summary
        run: |
          echo "### Terraform apply complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- environment: \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- worker image tag: \`${{ needs.build-and-push.outputs.image-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
