# Worker image build validation.
#
# This workflow BUILDS AND SCANS the inference image but NEVER PUSHES it and
# NEVER touches AWS. It needs no AWS account, no credentials and no secrets,
# so it is the first thing that can run on a fresh fork of this repository.
#
# Why it exists: the Dockerfile cannot be built on the development machine
# (no Docker, no WSL, ~600 MB free RAM). Without this, the first time anyone
# discovers a broken Dockerfile would be during a deployment. Pushing to ECR
# is a separate, manual, approval-gated job in deploy.yml.
#
# The image is large (CPU torch + ultralytics + baked weights), so the build
# is deliberately not run on every push to unrelated paths.

name: Worker image (build + scan, no push)

on:
  push:
    branches: [main, master]
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/requirements*.txt"
      - "backend/app/**"
      - ".github/workflows/worker-image.yml"
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/requirements*.txt"
      - "backend/app/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for the SARIF upload

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted runner has ~14 GB of disk; a torch image plus the build
      # cache can exhaust it. Reclaim the preinstalled toolchains we do not
      # use before starting.
      - name: Free runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "After:";  df -h / | tail -1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, do NOT push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false # never pushes; ECR publishing lives in deploy.yml
          load: true
          tags: visioniq-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Prove the image actually works, not merely that it built. These are
      # the two entrypoints the ECS task definition can select between.
      - name: Verify the application imports
        run: |
          docker run --rm visioniq-worker:${{ github.sha }} \
            python -c "import app.main; import app.config; app.config.get_settings(); print('app imports OK')"

      - name: Verify the model weights were baked in
        run: |
          docker run --rm visioniq-worker:${{ github.sha }} \
            python -c "
          import os, sys
          path = os.environ['VISIONIQ_MODEL_DIR'] + '/yolov8n.pt'
          size = os.path.getsize(path)
          print(f'weights: {path} ({size} bytes)')
          sys.exit(0 if size > 1_000_000 else 1)
          "

      # A worker with no queue configured must exit non-zero with a clear
      # message rather than hanging or crashing obscurely.
      - name: Verify the worker fails closed without a queue
        run: |
          set +e
          output=$(docker run --rm -e VISIONIQ_ROLE=worker visioniq-worker:${{ github.sha }} 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::worker exited 0 with no queue configured; it must fail closed"
            exit 1
          fi
          echo "$output" | grep -q "VISIONIQ_JOBS_QUEUE_URL" \
            || { echo "::error::expected a clear misconfiguration message"; exit 1; }

      - name: Verify it runs as a non-root user
        run: |
          user=$(docker run --rm visioniq-worker:${{ github.sha }} id -un)
          echo "container user: $user"
          [ "$user" != "root" ] || { echo "::error::image runs as root"; exit 1; }

      - name: Report image size
        run: |
          docker image inspect visioniq-worker:${{ github.sha }} \
            --format 'image size: {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"

      # Vulnerability scan. Soft-failing: a new CVE in a base image should
      # surface, not block an unrelated change. Results land in the
      # Security tab.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: visioniq-worker:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: worker-image

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Worker image validation"
            echo ""
            echo "- Built from \`backend/Dockerfile\` (no push, no AWS involved)"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Publishing to ECR is a separate manual job in \`deploy.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
