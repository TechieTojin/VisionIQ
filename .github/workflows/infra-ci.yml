name: Infrastructure CI

on:
  push:
    branches: ["**"]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infra-ci.yml"

# NOTE: this workflow only validates and scans Terraform.
# It never runs `terraform plan` against real credentials and never applies.
# All deployment lives in deploy.yml, which is manual (workflow_dispatch) only.

permissions:
  contents: read
  security-events: write # required to upload SARIF to GitHub code scanning

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform fmt / init / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  security-scan:
    name: tfsec security scan (soft-fail)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        continue-on-error: true
        with:
          working_directory: infrastructure/terraform
          sarif_file: tfsec.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfsec-sarif
          path: tfsec.sarif
          if-no-files-found: warn
          retention-days: 14
